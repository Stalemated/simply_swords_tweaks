plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "simply_swords_tweaks.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // S-Lib
    modImplementation "com.stalemated.lib:s-lib-forge:${rootProject.s_lib_version}"

    // YACL
    modRuntimeOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-forge"
    forgeRuntimeLibrary "org.quiltmc.parsers:gson:0.3.0"
    forgeRuntimeLibrary "org.quiltmc.parsers:json:0.3.0"

    // Architectury API
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    // Fzzy Config
    modImplementation ("me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}+forge") {
        transitive = false
    }
    modImplementation "thedarkcolour:kfflang:${rootProject.kotlinforforge_version}"
    modImplementation "thedarkcolour:kfflib:${rootProject.kotlinforforge_version}"
    modImplementation "thedarkcolour:kffmod:${rootProject.kotlinforforge_version}"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib:2.0.20"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:2.0.20"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.3"
    forgeRuntimeLibrary "net.peanuuutz.tomlkt:tomlkt-jvm:${rootProject.tomlkt_version}"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.3"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2"

    // MixinExtras (required by Puffish Attributes on Forge runtime)
    forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:0.4.1"
    modRuntimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"

    // Simply Swords
    modRuntimeOnly "curse.maven:simply-swords-659887:${rootProject.simply_swords_forge_file_id}"
    // Simply Tooltips
    modRuntimeOnly "curse.maven:simply-tooltips-1475755:${rootProject.simply_tooltips_forge_file_id}"

    // Puffish Skills
    modRuntimeOnly "curse.maven:puffish-skills-835091:${rootProject.puffish_skills_file_id_forge_0_17_3}"
    modRuntimeOnly "curse.maven:puffish-attributes-991341:${rootProject.puffish_attributes_file_id_forge}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    from project(':common').sourceSets.main.resources

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
